<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex 信号灯</title><link rel="stylesheet" href="/companion.css"><script defer src="/vendor/gifuct.js"></script><script defer src="/alpha-codec.js"></script><script defer src="/companion.js"></script></head>
<body><main class="shell">
<header><a class="brand" href="/">CODEX <span>COMPANION</span></a><span id="usbBadge" class="connection">连接设备中</span></header>
<section class="intro"><h1>设备控制</h1><div class="live-status" role="status"><span class="status-dot"></span><div><strong id="stateLabel">等待连接</strong><span id="stateDetail">正在读取设备</span></div></div></section>
<div class="section-title"><h2>屏幕</h2><button id="ackDone" class="secondary" type="button" disabled>确认已完成任务</button></div><p id="taskSummary" role="status"></p>
<section class="screens" aria-label="屏幕前景素材"><article class="screen" data-channel="1" data-role="done">
<div class="screen-top"><span class="screen-number">01</span><span class="role-label">完成 · 红灯</span></div>
<div class="lamp"><span class="task-dots" aria-hidden="true"></span><img alt="屏幕1前景预览" hidden><span class="empty-symbol">＋</span></div>
<button class="import" type="button">导入前景</button><input class="file" type="file" accept="image/gif,image/png,image/jpeg" hidden>
<progress max="100" value="0" hidden></progress><p class="upload-message" aria-live="polite"></p>
<details><summary>选择已有素材</summary><label>目录<input class="existing-dir" placeholder="/data/1" maxlength="47"></label><button class="use-existing secondary" type="button">使用此目录</button></details>
</article><article class="screen" data-channel="2" data-role="waiting">
<div class="screen-top"><span class="screen-number">02</span><span class="role-label">等待 · 黄灯</span></div>
<div class="lamp"><span class="task-dots" aria-hidden="true"></span><img alt="屏幕2前景预览" hidden><span class="empty-symbol">＋</span></div>
<button class="import" type="button">导入前景</button><input class="file" type="file" accept="image/gif,image/png,image/jpeg" hidden>
<progress max="100" value="0" hidden></progress><p class="upload-message" aria-live="polite"></p>
<details><summary>选择已有素材</summary><label>目录<input class="existing-dir" placeholder="/data/2_cleaned" maxlength="47"></label><button class="use-existing secondary" type="button">使用此目录</button></details>
</article><article class="screen" data-channel="3" data-role="working">
<div class="screen-top"><span class="screen-number">03</span><span class="role-label">工作 · 绿灯</span></div>
<div class="lamp"><span class="task-dots" aria-hidden="true"></span><img alt="屏幕3前景预览" hidden><span class="empty-symbol">＋</span></div>
<button class="import" type="button">导入前景</button><input class="file" type="file" accept="image/gif,image/png,image/jpeg" hidden>
<progress max="100" value="0" hidden></progress><p class="upload-message" aria-live="polite"></p>
<details><summary>选择已有素材</summary><label>目录<input class="existing-dir" placeholder="/data/3_cleaned" maxlength="47"></label><button class="use-existing secondary" type="button">使用此目录</button></details>
</article></section>
<section class="storage-settings"><h2>存储</h2><div class="actions"><button id="cleanStorage" class="secondary" type="button">清理内部空间</button><span id="storageInfo"></span></div><p id="storageMessage" class="message" role="status"></p></section>
<section class="settings"><h2>显示与提醒</h2><form id="settingsForm"><div class="form-grid">
<label>状态范围<select id="scopeMode"><option value="all">全部任务</option><option value="project">指定项目</option><option value="session">指定会话</option></select></label>
<label>项目 / 会话<select id="scopeTarget" disabled><option value="">全部任务</option></select></label>
<label>完成颜色<input id="colorDone" type="color" value="#ff0000"></label><label>等待颜色<input id="colorWaiting" type="color" value="#ffff00"></label><label>工作颜色<input id="colorWorking" type="color" value="#00ff00"></label>
<label>信号灯模式<select id="layout"><option value="traffic">各屏独立</option><option value="all">三屏同步</option></select></label>
<label>空闲动画<select id="idlePlayback"><option value="black">背景全黑</option><option value="colors">背景全亮</option><option value="off">关闭</option></select></label>
<label>完成后进入动画<select id="idleDoneDelay"><option value="10">红灯保留 10 秒</option><option value="0">立即进入</option><option value="-1">确认完成后进入</option></select></label>
<label>前景大小 <output id="foregroundValue">112 px</output><input id="foregroundSize" type="range" min="80" max="144" step="8" value="112"></label>
<label>亮度 <output id="brightnessValue">60%</output><input id="brightness" type="range" min="5" max="100" value="60"></label>
<label>音量 <output id="volumeValue">40%</output><input id="volume" type="range" min="0" max="80" value="40"></label>
</div><label class="check"><input id="muted" type="checkbox">静音</label><p id="soundHint" class="hint"></p><div class="actions"><button type="submit">保存设置</button><button id="testDone" class="secondary" type="button">试听完成提示音</button><button id="testWaiting" class="secondary" type="button">试听等待提示音</button></div><p id="settingsMessage" class="message" role="status"></p></form></section>
<details class="advanced"><summary>连接与诊断</summary><div class="advanced-content"><div class="actions"><button class="secondary state-test" data-state="working" type="button">测试绿灯</button><button class="secondary state-test" data-state="waiting" type="button">测试黄灯</button><button class="secondary state-test" data-state="done" type="button">测试红灯</button></div>
<form id="wifiForm"><h3>Wi-Fi · 2.4 GHz</h3><div class="form-grid"><label>网络名称<input id="ssid" maxlength="32" autocomplete="off" required></label><label>密码<input id="wifiPassword" type="password" maxlength="64" autocomplete="new-password"></label></div><button type="submit" class="secondary">连接网络</button><p id="wifiMessage" class="message" role="status"></p></form><pre id="deviceInfo">读取中</pre></div></details>
<footer><span>v1.0.0</span><a href="https://github.com/jnlpc123/esp32-codex-companion#readme" target="_blank" rel="noopener">使用说明</a></footer>
<div id="globalMessage" class="global-message" role="status" hidden></div>
</main></body></html>
